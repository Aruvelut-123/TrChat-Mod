version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "v2"
    schedule:
      interval: "weekly"
    groups:
      components:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v2"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"