name: Bug report
description: Report a TrChat NeoForge problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Checks
      options:
        - label: I am using Minecraft 1.21.1 and NeoForge 21.1.233 or newer.
          required: true
        - label: I reproduced the problem with the latest commit.
          required: true
  - type: input
    attributes:
      label: NeoForge version
      placeholder: 21.1.244
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Include steps to reproduce and the expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs and configuration
      description: Remove Redis passwords before pasting logs or trchat-neoforge.toml.
      render: shell
