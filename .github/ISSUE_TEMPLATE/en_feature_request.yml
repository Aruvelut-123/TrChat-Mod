name: Feature request
description: Suggest a feature for TrChat NeoForge
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: Duplicate check
      options:
        - label: I checked the README and existing issues before submitting this request.
          required: true
  - type: textarea
    attributes:
      label: Proposed feature
      description: Describe the use case, expected behavior, and Redis/Bukkit interoperability impact.
    validations:
      required: true
