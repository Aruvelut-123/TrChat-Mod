name: 问题报告
description: 报告 TrChat NeoForge 的问题
title: "[问题] "
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: 检查
      options:
        - label: 我使用 Minecraft 1.21.1 和 NeoForge 21.1.233 或更高版本。
          required: true
        - label: 我已在最新提交上复现该问题。
          required: true
  - type: input
    attributes:
      label: NeoForge 版本
      placeholder: 21.1.244
    validations:
      required: true
  - type: textarea
    attributes:
      label: 问题描述
      description: 请提供复现步骤和预期行为。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 日志与配置
      description: 粘贴日志或 config/trchat-neoforge 配置前请删除 Redis 与数据库密码。
      render: shell
