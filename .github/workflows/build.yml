name: TrChat Mod build

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: |
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test all nodes
        run: |
          ./gradlew \
            :1.21.1-neoforge:build \
            :1.21.11-neoforge:build \
            :26.1.2-neoforge:build \
            :26.2-neoforge:build \
            :1.21.1-fabric:build \
            :1.21.11-fabric:build \
            :26.1.2-fabric:build \
            :26.2-fabric:build \
            :1.20.1-forge:build

      - name: Add test results to job summary
        if: always()
        run: python3 scripts/ci-test-summary.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            versions/*/build/test-results/test/
            versions/*/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload 1.21.1 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TrChat-1.21.1-${{ github.run_number }}
          path: versions/1.21.1-*/build/libs/*.jar
          if-no-files-found: error

      - name: Upload 1.21.11 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TrChat-1.21.11-${{ github.run_number }}
          path: versions/1.21.11-*/build/libs/*.jar
          if-no-files-found: error

      - name: Upload 26.1.2 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TrChat-26.1.2-${{ github.run_number }}
          path: versions/26.1.2-*/build/libs/*.jar
          if-no-files-found: error

      - name: Upload 26.2 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TrChat-26.2-${{ github.run_number }}
          path: versions/26.2-*/build/libs/*.jar
          if-no-files-found: error

      - name: Upload 1.20.1 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TrChat-1.20.1-${{ github.run_number }}
          path: versions/1.20.1-*/build/libs/*.jar
          if-no-files-found: error
