name: build

on:
  push:
    branches: [pumpkin-experimental]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pumpkin

      - name: Build plugin (WASM component)
        run: |
          cd pumpkin
          cargo build --release --target wasm32-wasip2
          ls -la target/wasm32-wasip2/release/trchat_pumpkin.wasm

      - name: Verify WASM component
        run: |
          WASM=$(cd pumpkin && pwd)/target/wasm32-wasip2/release/trchat_pumpkin.wasm
          # A WASM component starts with \0asm + version 0d 00 01 00
          xxd -p -l 8 "$WASM" | grep -q "^0061736d0d000100" && echo "component magic OK"
          curl -sL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.259.0/wasm-tools-1.259.0-x86_64-linux.tar.gz -o /tmp/wt.tgz
          tar xzf /tmp/wt.tgz -C /tmp
          /tmp/wasm-tools-1.259.0-x86_64-linux/wasm-tools component wit "$WASM" | head -3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trchat-pumpkin
          path: pumpkin/target/wasm32-wasip2/release/trchat_pumpkin.wasm
