name: TrChat Mod build

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 1.20.1-forge
          - 1.21.1-neoforge
          - 1.21.11-neoforge
          - 26.1.2-neoforge
          - 26.2-neoforge
          - 26.3-neoforge
          - 1.21.1-fabric
          - 1.21.11-fabric
          - 26.1.2-fabric
          - 26.2-fabric
          - 26.3-fabric
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: |
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test ${{ matrix.node }}
        run: ./gradlew :${{ matrix.node }}:build

      - name: Test report ${{ matrix.node }}
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Tests ${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/test-results/test/TEST-*.xml
          reporter: java-junit
          only-summary: 'false'
          report-title: ${{ matrix.node }}
          list-suites: 'all'
          list-tests: 'all'
          fail-on-error: 'false'
          fail-on-empty: 'false'

      - name: Upload test reports ${{ matrix.node }}
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.node }}-${{ github.run_number }}
          path: |
            versions/${{ matrix.node }}/build/test-results/test/
            versions/${{ matrix.node }}/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload artifacts ${{ matrix.node }}
        uses: actions/upload-artifact@v7
        with:
          name: TrChat-${{ matrix.node }}-${{ github.run_number }}
          path: versions/${{ matrix.node }}/build/libs/*.jar
          if-no-files-found: error
