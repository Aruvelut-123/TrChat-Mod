name: TrChat build

on:
  push:
    branches:
      - v2
      - pumpkin-experimental
  pull_request:
    branches:
      - v2
      - pumpkin-experimental

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 1.20.1-forge
          - 1.21.1-neoforge
          - 1.21.11-neoforge
          - 26.1.2-neoforge
          - 26.2-neoforge
          - 26.3-neoforge
          - 1.21.1-fabric
          - 1.21.11-fabric
          - 26.1.2-fabric
          - 26.2-fabric
          - 26.3-fabric
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: |
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test ${{ matrix.node }}
        run: ./gradlew :${{ matrix.node }}:build

      - name: Test report ${{ matrix.node }}
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Tests ${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/test-results/test/TEST-*.xml
          reporter: java-junit
          only-summary: 'false'
          report-title: ${{ matrix.node }}
          list-suites: 'all'
          list-tests: 'all'
          fail-on-error: 'false'
          fail-on-empty: 'false'

      - name: Upload test reports ${{ matrix.node }}
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.node }}-${{ github.run_number }}
          path: |
            versions/${{ matrix.node }}/build/test-results/test/
            versions/${{ matrix.node }}/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload artifacts ${{ matrix.node }}
        uses: actions/upload-artifact@v7
        with:
          name: TrChat-${{ matrix.node }}-${{ github.run_number }}
          path: versions/${{ matrix.node }}/build/libs/*.jar
          if-no-files-found: error

  pumpkin:
    name: Build pumpkin (WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for pumpkin plugin
        id: check
        run: |
          if [ -f pumpkin/Cargo.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "pumpkin/ not present on this ref - skipping"
          fi

      - name: Set up Rust
        if: steps.check.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache Rust build
        if: steps.check.outputs.exists == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pumpkin

      - name: Install cargo-nextest
        if: steps.check.outputs.exists == 'true'
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Run Rust unit tests (JUnit)
        if: steps.check.outputs.exists == 'true'
        working-directory: pumpkin
        run: cargo nextest run --lib --profile ci --no-fail-fast

      - name: Build plugin (WASM component)
        if: steps.check.outputs.exists == 'true'
        working-directory: pumpkin
        run: cargo build --release --target wasm32-wasip2

      - name: Verify WASM component
        if: steps.check.outputs.exists == 'true'
        run: |
          WASM=pumpkin/target/wasm32-wasip2/release/trchat_pumpkin.wasm
          test -f "$WASM"
          # A WASM component starts with \0asm + version 0d 00 01 00
          xxd -p -l 8 "$WASM" | grep -q "^0061736d0d000100" && echo "component magic OK"
          curl -sL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.259.0/wasm-tools-1.259.0-x86_64-linux.tar.gz -o /tmp/wt.tgz
          tar xzf /tmp/wt.tgz -C /tmp
          /tmp/wasm-tools-1.259.0-x86_64-linux/wasm-tools component wit "$WASM" | head -3

      - name: Upload pumpkin artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: TrChat-pumpkin-${{ github.run_number }}
          path: pumpkin/target/wasm32-wasip2/release/trchat_pumpkin.wasm
          if-no-files-found: error

      - name: Publish pumpkin JUnit report
        if: (success() || failure()) && steps.check.outputs.exists == 'true'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: pumpkin/target/nextest/ci/junit.xml
          check_run_annotation: all
          comment_mode: off
