name: NeoForge release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build

      - name: Add test results to job summary
        if: always()
        run: python3 scripts/ci-test-summary.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-reports-${{ github.event.release.tag_name }}
          path: |
            build/test-results/test/
            build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 30

      - name: Generate notes from commits
        uses: orhun/git-cliff-action@v4
        with:
          args: --current --strip header --output RELEASE_NOTES.md

      - name: Replace release notes and upload jar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          find build/libs -maxdepth 1 -type f -name 'trchat_neoforge-*.jar' ! -name '*-sources.jar' -print0 |
            xargs -0 gh release upload "$TAG" --clobber
