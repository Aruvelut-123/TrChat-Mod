name: TrChat Mod release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test all nodes
        run: |
          ./gradlew \
            :1.21.1-neoforge:build \
            :1.21.11-neoforge:build \
            :26.1.2-neoforge:build \
            :26.2-neoforge:build \
            :1.21.1-fabric:build \
            :1.21.11-fabric:build \
            :26.1.2-fabric:build \
            :26.2-fabric:build

      - name: Add test results to job summary
        if: always()
        run: python3 scripts/ci-test-summary.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-reports-${{ github.event.release.tag_name }}
          path: |
            versions/*/build/test-results/test/
            versions/*/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 30

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: |
          git cliff --current --strip header --output RELEASE_NOTES.md

      - name: Replace release notes and upload jars
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          find versions -type f \( -path '*/build/libs/*.jar' \) ! -name '*-sources.jar' -print0 |
            xargs -0 gh release upload "$TAG" --clobber