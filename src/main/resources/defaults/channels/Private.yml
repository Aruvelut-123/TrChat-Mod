Options:
  Join-Permission: 'trchat.private'
  Proxy: true
  Disabled-Functions: ['Mention']
  Private: true

Bindings:
  Command: ['msg', 'message', 'tell', 'talk', 'm', 'whisper', 'w']

Sender:
  - prefix:
      sender:
        text: '&8[&a%player_name% &7➦ %trchat_toplayer%&8] '
    msg:
      default-color: 'f'
      hover: '&7时间: %server_time_HH:mm:ss%'

Receiver:
  - prefix:
      receiver:
        text: '&8[&6%player_name% &7➥ &2%trchat_toplayer%&8] '
    msg:
      default-color: 'f'
      hover: '&7时间: %server_time_HH:mm:ss%'

Console:
  - prefix:
      console:
        text: '&8[&dPM&8] &7%player_name% &8➥ &7%trchat_toplayer%&8: '
    msg:
      default-color: 'f'
