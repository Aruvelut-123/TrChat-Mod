# The Server channel is local-only by design and never uses Redis.
# Server 频道由代码强制限定为本服，不会通过 Redis 互通。
Options:
  Always-Listen: true
  Auto-Join: false
  Target: ALL

Console:
  - prefix:
      server:
        text: '&8[&6服务器&8] &e'
        hover: |-
          &7服务器: &3%server_name%
          &7版本: &6%server_version%
          &7在线: &a%server_online%&7/&2%server_max_players%
    msg:
      default-color: '&f'
      hover: '&7时间: %server_time_HH:mm:ss%'
