# TrChat NeoForge functions / 聊天功能
# Compatible with the Bukkit TrChat function.yml layout.
# 与 Bukkit TrChat 的 function.yml 层级和键名兼容。
# Action/Actions compatibility supports:
#   'console: command', 'player: command', 'message: text', 'sound: <sound> [volume] [pitch]'
#   'command "..." as console/player' and 'tell "..."'
# 可在动作中使用 {player}、{message} 与 {0}（匹配内容）。

General:
  Command-Controller:
    # Controls matching commands with optional exact matching, condition/permission checks, and cooldowns.
    # 使用可选的完整匹配、条件/权限检查和冷却控制匹配到的命令。
    # Built-in compatibility commands: arasple, ver/vers/version/versions, help/helps.
    # 内置兼容命令：arasple、ver/vers/version/versions、help/helps；shout 由 Global 频道绑定。
    Enabled: true
    List:
      - 'arasple{exact: true}{condition: perm "trchat.admin"}'
      - 'ver(sion)?(s)?{condition: perm "trchat.admin"}'
      - 'help(s)?{condition: perm *trchat.admin}'
      - 'shout{cooldown: 3}'
  Mention:
    Enabled: true
    Self-Mention: false
    Permission: 'none'
    Cooldown: '30s'
    Notify: true
    Pattern: '@? ?(names)'
    Action: []
  Mention-All:
    Enabled: true
    Permission: 'trchat.function.mentionall'
    Cooldown: '5m'
    Notify: true
    Keys: ['@all', '@everyone', '@everybody', '@所有人', '@全体成员']
    Action: []
  Item-Show:
    Enabled: true
    Permission: 'none'
    Cooldown: '30s'
    Origin-Name: false
    Compatible: false
    UI: true
    Keys: ['%i%', '%i', '%item%', '%item', '[i]', '[item]']
    Action: []
  Inventory-Show:
    Enabled: true
    Permission: 'trchat.function.inventoryshow'
    Cooldown: '30s'
    Keys: ['[inv]', '[inventory]']
    Action: []
  EnderChest-Show:
    Enabled: true
    Permission: 'trchat.function.enderchestshow'
    Cooldown: '30s'
    Keys: ['[ender]', '[enderchest]']
    Action: []

Custom:
  shareUrl:
    priority: 100
    pattern: '((https|http|ftp|rtsp|mms)?:\/\/)[^\s]+'
    action: []
    display:
      text: '&8[&f&l网站&8]'
      hover:
        - ''
        - '&3网站: {0}'
        - ''
        - '&7点击进入!'
        - ''
        - '&8[&c!&8] &7谨防任何诈骗'
      url: '{0}'
  shareQQ:
    condition: ~
    priority: 100
    pattern: 'QQ( )?[1-9]([0-9]{5,11})'
    text-filter: '[1-9]([0-9]{5,11})'
    display:
      text: '&8[&3&lQQ&8]'
      hover:
        - ''
        - '&3QQ: &b{0}'
        - ''
        - '&7这是一个 QQ 账号,'
        - '&7你可以点击此项快速打开聊天'
        - ''
        - '&8[&c!&8] &7请勿进行任何金钱交易'
        - '&8[&c!&8] &7交友需谨慎'
      url: 'https://wpa.qq.com/msgrd?v=3&uin={0}&site=qq&menu=yes'
  shareBilibili:
    pattern: 'BV( )?.{10}'
    text-filter: '.{12}'
    display:
      text: '&8[&f&lBilibili&8]'
      hover:
        - ''
        - '&7这可能是一个 Bilibili 视频,'
        - '&7点击即可访问'
        - ''
        - '&3BV号: &b{0}'
      url: 'https://www.bilibili.com/video/{0}'
  glowIP:
    pattern: '(25[0-5]|2[0-4]\d|[0-1]\d{2}|[1-9]?\d)\.(25[0-5]|2[0-4]\d|[0-1]\d{2}|[1-9]?\d)\.(25[0-5]|2[0-4]\d|[0-1]\d{2}|[1-9]?\d)\.(25[0-5]|2[0-4]\d|[0-1]\d{2}|[1-9]?\d)'
    display:
      text: '&e&n{0}'
      hover: '&7IP 地址；点击复制'
      copy: '{0}'
  glowEmail:
    pattern: '\w[-\w.+]*@([A-Za-z0-9][-A-Za-z0-9]+\.)+[A-Za-z]{2,14}'
    cooldown: '5s'
    display:
      text: '&e&n{0}'
      hover: '&7邮箱地址；点击复制'
      copy: '{0}'
  hidePhoneNumber:
    pattern: '((13[0-9])|(14[0-9])|(15[0-9])|(17[0-9])|(18[0-9]))\d{8}'
    display:
      text: '&8[&c&m-&8]'
      hover:
        - '&7该内容疑似为手机号码,'
        - '&7已自动屏蔽隐藏.'
        - ''
        - '&8[&c!&8] &7请勿分享任何隐私信息'
  hideIDCardNumber:
    pattern: '([1-9]\d{5}[12]\d{3}(0[1-9]|1[012])(0[1-9]|[12][0-9]|3[01])\d{3}[0-9xX])'
    display:
      text: '&8[&c&m-&8]'
      hover:
        - '&7该内容疑似为身份证号,'
        - '&7已自动屏蔽隐藏.'
        - ''
        - '&8[&c!&8] &7请勿分享任何隐私信息'
        - '&7严重者可能处于禁言/封禁'
