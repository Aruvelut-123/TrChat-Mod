modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Aruvelut-123/TrChat-Mod/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Aruvelut-123/TrChat-Mod"
authors="Baymaxawa (Forge author and maintainer); Arasple and ItsFlicker (original TrChat authors); original TrChat contributors"
description='''
A server-side chat control mod for Forge 1.20.1 (LTS).
Redis is the only cross-server transport and remains wire-compatible with TrChat Bukkit 2.4.9.
'''

[[dependencies.${mod_id}]]
modId="forge"
type="required"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="SERVER"
