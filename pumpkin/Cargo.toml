[package]
name = "trchat-pumpkin"
version = "0.1.0"
edition = "2021"
description = "TrChat experimental support for PumpkinMC (Rust / WASM plugin)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", tag = "0.2.0+26.3-26.51" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
opt-level = "s"
lto = true
strip = true
