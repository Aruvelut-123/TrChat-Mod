[package]
name = "trchat-pumpkin"
# Kept in step with `mod_version` in the repository `gradle.properties`
# (`2.5.4.1`). Cargo versions are strict `MAJOR.MINOR.PATCH`, so the Mod's fourth
# segment lives in build metadata; the plugin reports the exact `mod_version`
# through `TRCHAT_VERSION` (see `build.rs`), which is what the server lists.
version = "2.5.4+1"
edition = "2021"
description = "TrChat experimental support for PumpkinMC (Rust / WASM plugin)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", tag = "0.2.0+26.3-26.51" }
regex = "1.13.1"
# Cross-server chat (`Redis.Enabled`, `/trchat redis reconnect`). Redis itself
# speaks RESP over TCP and `wasm32-wasip2`'s `std` provides `std::net`, so the
# client is a library rather than a hand-rolled protocol: the Java port needed
# its own `RespConnection` only because it had no dependency to lean on.
# Default features are off (no TLS, ACL, streams, scripts extras).
redis = { version = "1.7.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# The state store (`datasource.yml`) now runs the embedded engine directly:
# turso_core (limbo) is a SQLite engine that compiles to `wasm32-wasip2`
# (its generic IO backend uses `std::fs`), so the port persists player data
# to a real `data.db` instead of the earlier per-player JSON fallback.
# Features mirror the `dbprobe` harness so the probe's behaviour is exactly
# what the plugin sees. Default features are off (no networking extras).
turso_core = { version = "0.8.1", default-features = false, features = ["fs", "time", "uuid", "json", "pure-rust-crypto"] }

# The update checker (`updates:`) talks to the GitHub API through the host's
# `wasi:http` client, which the `wasm32-wasip2` target links in. Keep it
# target-specific so host builds (`cargo test`) stay free of WASI bindings.
#
# Pinned exactly: the Rust toolchain's `std` links `wasi:*` at the 0.2.9
# snapshot, and a newer `wasip2` would raise the whole component (stdlib imports
# included) to its own snapshot — a host that satisfies today's component would
# then refuse to instantiate it. `1.0.2` is the last release on 0.2.9.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2 = "=1.0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
