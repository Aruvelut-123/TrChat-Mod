[package]
name = "trchat-pumpkin"
version = "0.1.0"
edition = "2021"
description = "TrChat experimental support for PumpkinMC (Rust / WASM plugin)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "fc780ec7cb44900b10f7ab59d746606cc8bbdbd7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true