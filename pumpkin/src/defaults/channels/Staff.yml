Options:
  Join-Permission: 'trchat.admin'
  Proxy: true
  Always-Listen: true

Bindings:
  Command: ['staff']

Formats:
  - prefix:
      staff:
        text: '&8[&cSTAFF&8] '
        hover: '&7服务器: &3%server_name%'
      player:
        text: '&e%player_name%&8: '
    msg:
      default-color: 'a'
      special-char:
        enabled: false
        special-char-color: '&f'
      hover: '&7时间: %server_time_HH:mm:ss%'

