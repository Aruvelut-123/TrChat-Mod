[changelog]
header = """
# 更新内容

"""
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }}{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim }}

{% for commit in commits %}- {{ commit.message | split(pat="\n") | first | trim }} (`{{ commit.id | truncate(length=7, end="") }}`)
{% endfor %}{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "新增" },
  { message = "^fix", group = "修复" },
  { message = "^perf", group = "性能" },
  { message = "^refactor", group = "调整" },
  { message = "^docs", group = "文档" },
  { message = "^test", group = "测试" },
  { message = "^(build|ci)", group = "构建与 CI" },
  { message = "^(chore|revert)", group = "维护" },
  { message = ".*", group = "其他" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = '^v?[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?(?:[-+][0-9A-Za-z.-]+)?$'
topo_order = false
sort_commits = "oldest"
